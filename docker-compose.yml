# Dedicated local demo database.
#
# Port 55433, not 5432 and not 55432: 5432 is the conventional local Postgres
# port, and 55432 is already used by the flagship project's own test container
# (`fincore-pg`). The demo must not collide with either.
#
# The credentials below are LOCAL DEVELOPMENT VALUES. They grant access to
# nothing outside this machine and are not secrets.

services:
  fincore-demo-pg:
    container_name: fincore-demo-pg
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore
      POSTGRES_DB: fincore_demo
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
